<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- displays site properly based on user's device -->

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./images/favicon-32x32.png"
        />

        <title>Frontend Mentor | QR code component</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <link href="./output.css" rel="stylesheet" />
    </head>
    <body>
        <div class="flex h-dvh items-center justify-center bg-slate-300">
            <div
                class="flex w-[320px] flex-col items-center justify-center gap-6 rounded-[20px] bg-white p-4 lg:pb-10"
            >
                <img
                    class="rounded-[10px]"
                    src="./images/image-qr-code.png"
                    alt="qr code"
                />
                <div
                    class="flex flex-col items-center justify-center gap-4 px-4"
                >
                    <h1 class="text-slate-900 text-center font-bold text-[22px] leading-[120%]">
                        Improve your front-end skills by building projects
                    </h1>
                    <p class="text-slate-500 text-center text-[15px] leading-[140%] tracking-[0.2px]">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
                </div>
            </div>
        </div>
    </body>
</html>
